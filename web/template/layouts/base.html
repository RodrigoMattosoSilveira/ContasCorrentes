<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Responsive Collapsible Sidebar with Hover Expand</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- ✅ Official Bootstrap Icons CDN (updated link) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    main {
      flex: 1;
    }

    header,
    footer {
      background-color: #343a40;
      color: white;
      padding: 1rem;
    }

    /* Sidebar base styles */
    .sidebar {
      background-color: #f8f9fa;
      border-right: 1px solid #dee2e6;
      min-height: 100%;
      transition: all 0.3s ease;
      overflow-x: hidden;
      white-space: nowrap;
      z-index: 1045;
    }

    @media (min-width: 768px) {
      .sidebar {
        width: 240px;
      }
      .sidebar.collapsed {
        width: 80px;
      }
    }

    .sidebar.collapsed h5,
    .sidebar.collapsed .nav-link span {
      display: none;
    }

    .sidebar.collapsed .nav-link {
      text-align: center;
    }

    @media (min-width: 768px) {
      .sidebar.collapsed:hover {
        width: 240px;
      }
      .sidebar.collapsed:hover h5,
      .sidebar.collapsed:hover .nav-link span {
        display: inline;
      }
      .sidebar.collapsed:hover .nav-link {
        text-align: left;
      }
    }

    /* Mobile slide-in sidebar */
    @media (max-width: 767.98px) {
      .sidebar {
        position: fixed;
        top: 0;
        left: -250px;
        width: 250px;
        height: 100%;
        z-index: 1045;
        transition: left 0.3s ease;
      }

      .sidebar.show {
        left: 0;
      }

      .sidebar-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1040;
      }

      .sidebar-overlay.active {
        display: block;
      }
    }

    .content-area {
      transition: margin-left 0.3s ease;
    }

    @media (min-width: 768px) {
      .sidebar + .content-area {
        margin-left: 240px;
      }
      .sidebar.collapsed + .content-area {
        margin-left: 80px;
      }
      .sidebar.collapsed:hover + .content-area {
        margin-left: 240px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="d-flex justify-content-between align-items-center px-3">
    <div class="d-flex align-items-center gap-2">
      <button class="btn btn-outline-light d-md-none" id="menu-toggle">
        <i class="bi bi-list"></i>
      </button>

      <button class="btn btn-outline-light d-none d-md-inline-block" id="collapse-toggle">
        <i class="bi bi-layout-sidebar-inset"></i>
      </button>

      <h1 class="h4 mb-0 ms-2">Mineracao Carara</h1>
    </div>

    <div>
      <button class="btn btn-outline-light btn-sm">
        <i class="bi bi-box-arrow-right"></i> Logout
      </button>
    </div>
  </header>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main -->
  <main class="container-fluid p-0">
    <div class="row g-0">
      <!-- Sidebar -->
      <nav class="col-auto sidebar p-3" id="sidebar">
        <h5>Menu</h5>
        <ul class="nav flex-column">
          <li class="nav-item">
            <a href="#" class="nav-link d-flex align-items-center gap-2">
              <i class="bi bi-house"></i><span>Home</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link d-flex align-items-center gap-2">
              <i class="bi bi-bar-chart"></i><span>Analytics</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link d-flex align-items-center gap-2">
              <i class="bi bi-people"></i><span>Users</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="#" class="nav-link d-flex align-items-center gap-2">
              <i class="bi bi-gear"></i><span>Settings</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Content -->
      <section class="col content-area p-4" id="content-area">
        <h2>Conta Corrente</h2>
        <div class="table-container"> 
          <table class="table"> 
             <tr>
              <th class="fs-2 table-primary" colspan="3">Atual</th>
            </tr>
            <tr> 
              <th scope="col"></th>
              <th scope="col">Real ($)</th>
              <th scope="col">Ouro (g)</th>
            </tr> 
            <tr> 
              <td>Crédito</td>
              <td>$.00</td>
              <td>$.00</td>
            </tr> 
            <tr>                       
              <td>Débito</td>
              <td>$.00</td>
              <td>$.00</td>
             </tr> 
            <tr class="fw-bold"> 
              <td>Saldo</td>
              <td>$.00</td>
              <td>$.00</td>
            </tr> 
          </table> 

          <table class="table"> 
            <th colspan="3"  class="fs-2 table-warning">Renda Potencial / Disponível</th>
            <tr> 
            <tr>
              <th scope="col"></th>
              <th scope="col">Real ($)</th>
              <th scope="col">Ouro (g)</th>
            </tr> 
            <tr> 
              <td>Saldo</td>
              <td>$.00</td>
              <td>$.00</td>
            </tr> 
            <tr>
              <td>A ganhar:</td>
              <td>$.00</td>
              <td>$.00</td>
             </tr>
             <tr class="fw-bold">
              <td>Disponível</td>
              <td>$.00</td>
              <td>$.00</td>
              </tr>      
          </table> 
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="text-center">
    <p>&copy; 2025 Madrone Logistics</p>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/htmx-ext-response-targets@2.0.4" integrity="sha384-T41oglUPvXLGBVyRdZsVRxNWnOOqCynaPubjUVjxhsjFTKrFJGEMm3/0KGmNQ+Pg" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/hyperscript.org@0.9.14"></script>

  <script>
    const menuToggle = document.getElementById("menu-toggle");
    const collapseToggle = document.getElementById("collapse-toggle");
    const sidebar = document.getElementById("sidebar");
    const overlay = document.getElementById("sidebar-overlay");

    // Mobile toggle
    menuToggle.addEventListener("click", () => {
      sidebar.classList.toggle("show");
      overlay.classList.toggle("active");
    });

    overlay.addEventListener("click", () => {
      sidebar.classList.remove("show");
      overlay.classList.remove("active");
    });

    // Desktop collapse toggle
    collapseToggle.addEventListener("click", () => {
      sidebar.classList.toggle("collapsed");
    });
  </script>
</body>
</html>
