<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login Page with Icons</title>

  <!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      max-width: 400px;
      width: 100%;
      padding: 2rem;
      border-radius: 0.75rem;
      background-color: #fff;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
    }

    .login-card h2 {
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .input-group-text {
      background-color: #e9ecef;
    }

    @media (max-width: 576px) {
      .login-card {
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ .CSRFToken }}"}'>

  <div class="login-card">
    <h2>Login</h2>
     <form hx-post="/login"  hx-target="#login-message" hx-swap="innerHTML">
		<!-- Gorilla CSRF requires the token to be in the form body -->
		<input type="hidden" name="gorilla.csrf.Token" value="{{ .CSRFToken }}">
		<!-- Email input with icon -->
		<div class="mb-3">
			<label for="email" class="form-label">Email address</label>
			<div class="input-group">
				<span class="input-group-text"><i class="bi bi-envelope"></i></span>
				<input
					type="email"
					class="form-control"
					id="email"
					name="email" 
					placeholder="Enter email"
					required
				/>
			</div>
		</div>

      <!-- Password input with icon -->
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input
            type="password"
            class="form-control"
            id="password"
			name="password" 
            placeholder="Enter password"
            required
          />
        </div>
      </div>

      <!-- Remember me checkbox -->
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="remember" />
        <label class="form-check-label" for="remember">Remember me</label>
      </div>

      <!-- Submit button -->
      <button type="submit" class="btn btn-primary w-100">
        <i class="bi bi-box-arrow-in-right me-1"></i> Login
      </button>

	<!-- Error message container -->
	<div id="login-message"></div>


      <!-- Links -->
      <div class="d-flex justify-content-between mt-3">
        <a href="#" class="small">Forgot password?</a>
        <a href="#" class="small">Sign up</a>
      </div>
    </form>
  </div>

  <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>    <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js" integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/htmx-ext-response-targets@2.0.4" integrity="sha384-T41oglUPvXLGBVyRdZsVRxNWnOOqCynaPubjUVjxhsjFTKrFJGEMm3/0KGmNQ+Pg" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/hyperscript.org@0.9.14"></script>   
    <script>
        document.addEventListener('htmx:trigger', function (event) {
            if ( document.getElementById("login-message" !== null) ) {
                document.getElementById("login-message").innerHTML = "";
            }
        });
    </script>

</body>
</html>
